name: Notification receiver
on:
  push:
    paths: ['webhook/**', '.github/workflows/receiver.yml']
  pull_request:
    paths: ['webhook/**', '.github/workflows/receiver.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: webhook/package-lock.json
      - run: npm ci --prefix webhook
      - run: npm test --prefix webhook
      - run: docker build -t notification-receiver:test webhook
      - run: git diff --check
