name: Web dashboard
on:
  push:
    paths: ['dashboard/**', 'webhook/**', 'compose.yaml', 'scripts/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['dashboard/**', 'webhook/**', 'compose.yaml', 'scripts/**', '.github/workflows/web.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: |
            webhook/package-lock.json
            dashboard/package-lock.json
      - run: npm ci --prefix webhook
      - run: npm ci --prefix dashboard
      - run: npm test --prefix webhook
      - run: npm run lint --prefix dashboard
      - run: npm test --prefix dashboard
      - run: npm run build --prefix dashboard
      - run: npm run typecheck --prefix dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:e2e --prefix dashboard
      - run: node scripts/composeSmoke.mjs
      - run: git diff --check
